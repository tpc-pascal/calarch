LAUNCHER_ENGINE="rofi"
LAUNCHER_THEME="ultrafocus"
LAUNCHER_SHORTCUT="Super+Space"
FIREFOX_VTABS="yes"
FIREFOX_VTABS_ENGINE="sidebery"
FIREFOX_PRIVACY="strict"
EDITOR_ENGINE="neovim"
EDITOR_DISTRO="lazyvim"
MEDIA_YT_PLAYER="mpv"
MEDIA_QUALITY="1080p"
SPOTIFY_THEME="dribbblish"
SPOTIFY_ADBLOCK="yes"
NOTES_ENGINE="emacs-org"
