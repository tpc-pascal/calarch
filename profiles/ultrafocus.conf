# Ultrafocus profile — tap trung toi da, keyboard-first workflow
AFFINITY_ACTIVE_CORES="0,1"
AFFINITY_BG_CORES="2,3"
AFFINITY_ACTIVE_SCHED="rr"
AFFINITY_ACTIVE_PRIORITY=50
AFFINITY_ACTIVE_IONICE=0
AFFINITY_BG_IONICE=5
SUPER_COOL_THRESHOLD=30
SUPER_HOT_THRESHOLD=70
SUPER_COOL_DEBOUNCE=10
SUPER_HOT_DEBOUNCE=5
SUPER_COOL_GOVERNOR="powersave"
SUPER_HOT_GOVERNOR="schedutil"
UNDERVOLT_CPU=-50
UNDERVOLT_GPU=-20
UNDERVOLT_CACHE=-50
ECO_CHARGE_LIMIT=80
MAX_CSTATE=4
KERNEL_PARAMS="nowatchdog processor.max_cstate=4 intel_idle.max_cstate=4 i915.enable_fbc=1 i915.enable_psr=1 i915.enable_rc6=1 i915.fastboot=1 mitigations=off pcie_aspm=force"
POMODORO_WORK_MINUTES=25
POMODORO_BREAK_MINUTES=5
POMODORO_CYCLES=4
BLOCKER_SITES="facebook.com,twitter.com,x.com,instagram.com,reddit.com,tiktok.com,youtube.com,netflix.com"
DISPLAY_SCALE=1.5
DISPLAY_RESOLUTION="2160x1440"
