[Service]
# Gioi han CPU: Ollama chi dung 2 threads
Environment="OLLAMA_NUM_THREADS=2"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# Khoa Ollama vao Core 2,3 (khong canh tranh voi UI)
CPUAffinity=2 3

# Uu tien thap: nice=10, khong anh huong den interactive tasks
Nice=10
IOSchedulingClass=best-effort
IOSchedulingPriority=7

# Gioi han bo nho de tranh OOM
MemoryMax=4G
MemoryHigh=3G
