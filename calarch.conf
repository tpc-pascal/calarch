# ============================================================================
# calarch.conf — Cau hinh trung tam cho Panasonic CF-XZ6
# Tat ca tham so he thong tap trung tai 1 file duy nhat.
#
# Cach dung:
#   source calarch.conf           # Nap vao shell
#   bash lib/core.sh get <KEY>    # Doc gia tri
#   bash lib/core.sh set <KEY> <VAL>  # Thay doi + apply an toan
# ============================================================================

# === CPU AFFINITY ENGINE ===
# Core danh cho cua so dang active (uong tien)
AFFINITY_ACTIVE_CORES="0,1"
# Core danh cho tien trinh nen
AFFINITY_BG_CORES="2,3"
# Scheduling policy: rr (round-robin) hoac other
AFFINITY_ACTIVE_SCHED="rr"
# Priority (1-99, cao hon = uu tien hon, chi dung voi rr/fifo)
AFFINITY_ACTIVE_PRIORITY=50
# I/O priority: 0 (cao nhat) den 7 (thap nhat)
AFFINITY_ACTIVE_IONICE=0
AFFINITY_BG_IONICE=5

# === SUPER MODE DAEMON ===
# Nguong % CPU load de chuyen COOL (<) / HOT (>)
SUPER_COOL_THRESHOLD=30
SUPER_HOT_THRESHOLD=70
# Thoi gian (giay) load duoi/tren nguong lien tuc de chuyen mode
SUPER_COOL_DEBOUNCE=10
SUPER_HOT_DEBOUNCE=5
# CPU governor: powersave, schedutil, performance, conservative, ondemand
SUPER_COOL_GOVERNOR="powersave"
SUPER_HOT_GOVERNOR="schedutil"

# === UNDERVOLT (mV) ===
# Giam dien ap CPU/GPU/Cache — gia tri am = giam, 0 = tat
UNDERVOLT_CPU=-50
UNDERVOLT_GPU=-20
UNDERVOLT_CACHE=-50

# === ECO MODE ===
# Gioi han sac pin (%): 0=tat, 50-100
ECO_CHARGE_LIMIT=80

# === THERMAL & KERNEL ===
# Trang thai C thap nhat cho phep (1-10, thap = tiet kiem hon)
MAX_CSTATE=4
# Tham so kernel dong (can reboot de ap dung)
KERNEL_PARAMS="nowatchdog processor.max_cstate=4 intel_idle.max_cstate=4 i915.enable_fbc=1 i915.enable_psr=1 i915.enable_rc6=1 i915.fastboot=1 mitigations=off pcie_aspm=force"

# === POMODORO FOCUS ===
POMODORO_WORK_MINUTES=25
POMODORO_BREAK_MINUTES=5
POMODORO_CYCLES=4

# === WEBSITE BLOCKER ===
BLOCKER_SITES="facebook.com,twitter.com,x.com,instagram.com,reddit.com,tiktok.com,youtube.com,netflix.com"

# === DISPLAY ===
DISPLAY_SCALE=1.5
DISPLAY_RESOLUTION="2160x1440"
DISPLAY_REFRESH=60

# === ULTRAFOCUS LAUNCHER ===
# Cong cu goi ung dung: rofi, dmenu, wofi
LAUNCHER_ENGINE="rofi"
# Theme cho launcher
LAUNCHER_THEME="ultrafocus"
# Phim tat goi launcher
LAUNCHER_SHORTCUT="Super+Space"

# === ULTRAFOCUS FIREFOX ===
# Che do vertical tabs: yes / no
FIREFOX_VTABS="yes"
# Engin vertical tabs: sidebery / tree-style-tab
FIREFOX_VTABS_ENGINE="sidebery"
# Muc do bao mat: strict / standard / custom
FIREFOX_PRIVACY="strict"

# === ULTRAFOCUS EDITOR ===
# Trinh soan thao: neovim / emacs / vscode
EDITOR_ENGINE="neovim"
# Distro Neovim: lazyvim / astronvim / nvchad
EDITOR_DISTRO="lazyvim"

# === ULTRAFOCUS MEDIA ===
# Trinh phat YouTube: mpv / vlc
MEDIA_YT_PLAYER="mpv"
# Chat luong mac dinh: 720p / 1080p / 2160p / best
MEDIA_QUALITY="1080p"

# === ULTRAFOCUS SPOTIFY ===
# Theme Spicetify: dribbblish / text / sublime / default
SPOTIFY_THEME="dribbblish"
# Chan quang cao Spotify
SPOTIFY_ADBLOCK="yes"

# === DRIVE MOUNT ===
# Thu muc goc de mount partition
MOUNT_BASE="/mnt"

# === WALLPAPER ===
# Thu muc chua wallpaper
WALLPAPER_DIR="$HOME/Pictures/wallpapers"
# Engine: hyprpaper, swaybg, feh
WALLPAPER_ENGINE="hyprpaper"
# Monitor name (de trong = auto detect)
WALLPAPER_MONITOR=""

# === ULTRAFOCUS NOTES ===
# Cong cu ghi chu: emacs-org / obsidian
NOTES_ENGINE="emacs-org"
