name: Build & Release
on:
  push:
    tags: 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
            if [ -z "$VER" ]; then
              LAST=$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
              if [ -z "$LAST" ]; then
                VER="1.0"
              else
                MAJOR="${LAST%.*}"
                MINOR="${LAST#*.}"
                VER="$MAJOR.$((MINOR + 1))"
              fi
            fi
            echo "VERSION=$VER" >> $GITHUB_ENV
            echo "TAG=v$VER" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
            echo "TAG=$GITHUB_REF_NAME" >> $GITHUB_ENV
          fi

      - name: Create & push tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Shellcheck
        run: |
          for f in bootstrap.sh make.sh start.sh lib/*.sh; do
            case "$f" in lib/web.sh) continue;; esac
            shellcheck -S error "$f"
          done

      - name: Bash syntax check
        run: |
          for f in bootstrap.sh make.sh start.sh lib/*.sh; do
            case "$f" in lib/web.sh) continue;; esac
            bash -n "$f"
          done

      - name: Build .run
        run: VERSION="$VERSION" bash make.sh

      - name: Checksum
        run: sha256sum "calarch-v${VERSION}.run" > "calarch-v${VERSION}.run.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: "Release ${{ env.TAG }}"
          files: |
            calarch-v${{ env.VERSION }}.run
            calarch-v${{ env.VERSION }}.run.sha256
